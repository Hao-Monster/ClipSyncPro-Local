name: ClipSync Pro Windows Local CI

on:
  push:
    branches: [main, feat/windows-local-standalone]
  pull_request:
    branches: [main, feat/windows-local-standalone]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clipsync-pro-local-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Windows Local Test & Build Verification
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Run Unit Tests
        shell: pwsh
        run: |
          go test -v ./...

      - name: Build Go Binaries (Agent & Windows Native)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags="-s -w" -o "dist/ClipSyncPro-Agent.exe" ./cmd/clipsync-agent
          go build -trimpath -ldflags="-s -w" -o "dist/ClipSyncPro-Windows.exe" ./cmd/clipsync-windows

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build WinUI 3 Desktop Client
        shell: pwsh
        run: |
          dotnet build "windows/ClipSyncPro.WinUI/ClipSyncPro.WinUI.csproj" -c Release -p:Platform=x64 --nologo
